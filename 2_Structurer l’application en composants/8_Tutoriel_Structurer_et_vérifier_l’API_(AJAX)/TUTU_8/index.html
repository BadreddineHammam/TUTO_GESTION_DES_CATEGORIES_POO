<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lazy Dev Excuse Generator</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 50px;">

    <h1>🚨 The Ultimate Programmer Excuse Generator 🚨</h1>
    <p>Click the button when your professor asks why your code has errors:</p>
    
    <button id="excuseBtn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
        Give Me an Excuse!
    </button>
    
    <!-- Where JavaScript will inject the HTML results -->
    <ul id="excuseList" style="list-style: none; margin-top: 20px; font-size: 18px; color: #d9534f;">
    </ul>

    <!-- Load our JavaScript file -->
    <script src="app.js"></script>
</body>
</html>
