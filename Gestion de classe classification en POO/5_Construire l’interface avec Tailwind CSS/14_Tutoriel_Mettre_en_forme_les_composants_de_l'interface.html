<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Blog - Catégories</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="flex min-h-screen">

      
        <aside class="w-64 bg-gray-800 text-white flex flex-col p-6 gap-4">
            <h2 class="text-xl font-bold border-b border-gray-600 pb-4">Admin Blog</h2>

            <nav class="flex flex-col gap-1">
            
                <a href="#" class="px-3 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition-colors">
                    Tableau de bord
                </a>
              
                <a href="#" class="px-3 py-2 rounded-lg bg-blue-600 text-white font-medium">
                    Catégories
                </a>
                
                <a href="#" class="px-3 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition-colors">
                    Articles
                </a>
                <a href="#" class="px-3 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition-colors">
                    Commentaires
                </a>
            </nav>
        </aside>

        
        <div class="flex-1 flex flex-col">

         
            <header class="bg-white border-b border-gray-200 shadow-sm px-6 py-4 flex items-center justify-between">
                <h1 class="text-lg font-semibold text-gray-800">Gestion des catégories</h1>
                <span class="text-sm text-gray-500">Admin</span>
            </header>

           
            <main class="flex-1 p-6 space-y-6">

              
                <div class="flex justify-end">
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition-colors">
                        + Nouvelle catégorie
                    </button>
                </div>

               
                <section class="bg-white rounded-lg shadow-sm p-6">
                    <h2 class="text-base font-semibold text-gray-700 mb-4">Ajouter une catégorie</h2>

                    <form class="grid grid-cols-1 md:grid-cols-2 gap-4">

                   
                        <div class="flex flex-col gap-1">
                            <label for="nom" class="text-sm font-medium text-gray-700">Nom</label>
                            <input
                                type="text"
                                id="nom"
                                name="nom"
                                placeholder="Ex : Technologie"
                                class="border border-gray-300 rounded-lg w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                        </div>

                   
                        <div class="flex flex-col gap-1">
                            <label for="description" class="text-sm font-medium text-gray-700">Description</label>
                            <input
                                type="text"
                                id="description"
                                name="description"
                                placeholder="Description de la catégorie"
                                class="border border-gray-300 rounded-lg w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                        </div>

                    
                        <div class="md:col-span-2 flex gap-2 pt-2">
                            <button
                                type="submit"
                                class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition-colors"
                            >
                                Enregistrer
                            </button>
                            <button
                                type="reset"
                                class="bg-white text-gray-600 border border-gray-300 px-4 py-2 rounded-lg hover:bg-gray-50 transition-colors"
                            >
                                Annuler
                            </button>
                        </div>

                    </form>
                </section>

              
                <section class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <table class="w-full text-sm">
                        <thead class="bg-gray-50 text-left text-xs text-gray-500 uppercase">
                            <tr>
                                <th class="px-6 py-3">ID</th>
                                <th class="px-6 py-3">Nom</th>
                                <th class="px-6 py-3">Description</th>
                                <th class="px-6 py-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-6 py-3 text-gray-700">1</td>
                                <td class="px-6 py-3 font-medium text-gray-800">Technologie</td>
                                <td class="px-6 py-3 text-gray-500">Articles sur la tech</td>
                                <td class="px-6 py-3">
                                    <button class="text-blue-600 hover:text-blue-800 font-medium">Modifier</button>
                                    <button class="ml-3 text-red-600 hover:text-red-800 font-medium">Supprimer</button>
                                </td>
                            </tr>
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-6 py-3 text-gray-700">2</td>
                                <td class="px-6 py-3 font-medium text-gray-800">Voyage</td>
                                <td class="px-6 py-3 text-gray-500">Récits et conseils</td>
                                <td class="px-6 py-3">
                                    <button class="text-blue-600 hover:text-blue-800 font-medium">Modifier</button>
                                    <button class="ml-3 text-red-600 hover:text-red-800 font-medium">Supprimer</button>
                                </td>
                            </tr>
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-6 py-3 text-gray-700">3</td>
                                <td class="px-6 py-3 font-medium text-gray-800">Cuisine</td>
                                <td class="px-6 py-3 text-gray-500">Recettes et astuces</td>
                                <td class="px-6 py-3">
                                    <button class="text-blue-600 hover:text-blue-800 font-medium">Modifier</button>
                                    <button class="ml-3 text-red-600 hover:text-red-800 font-medium">Supprimer</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>

            </main>
        </div>
    </div>

</body>
</html>
