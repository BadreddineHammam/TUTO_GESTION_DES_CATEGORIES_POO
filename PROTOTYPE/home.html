<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Categories Manager</title>
</head>
<body class="bg-gray-50 p-8">

    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md space-y-6">
        
        <form class="space-y-4" method="POST" id="form_category">
            <input type="hidden" id="id_category">

            <div class="flex flex-col">
                <label class="text-sm font-semibold text-gray-700 mb-1" id="name_label">Name</label>
                <input class="border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" type="text" id="name" placeholder="Enter name...">
            </div>

            <div class="flex flex-col">
                <label class="text-sm font-semibold text-gray-700 mb-1" id="category_label">Category</label>
                <input class="border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" type="text" id="category" placeholder="Enter category...">
            </div>

            <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition" id="add_button">
                ADD
            </button>
        </form>

        <div class="overflow-x-auto">
            <table class="w-full border-collapse border border-gray-200 text-left text-sm">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="border border-gray-200 p-2">The ID</th>
                        <th class="border border-gray-200 p-2">The Name</th>
                        <th class="border border-gray-200 p-2">The Category</th>
                    </tr>
                </thead>
                <tbody id="result_final">
                </tbody>
            </table>
        </div>

    </div>

    <script src="sender.js"></script>
</body>
</html>
