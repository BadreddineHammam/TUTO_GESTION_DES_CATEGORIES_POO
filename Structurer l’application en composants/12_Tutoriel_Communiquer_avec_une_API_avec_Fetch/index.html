</button>

    <input type="hidden" id="categorieId">

    <label for="nom">Nom :</label>
    <input
        type="text"
        id="nom"
        placeholder="Nom"
        required
    >

    <br><br>

    <label for="couleur">Couleur :</label>
    <input
        type="text"
        id="couleur"
        placeholder="Couleur"
        required
    >

        type="text"
        id="icone"
        placeholder="Icône"
        required
    >
